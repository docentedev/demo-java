name: Deploy Spring Boot to EC2

on:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21' # Si requieres otra versión puedes ajustarla aquí

    # Usamos Gradle en lugar de Maven
    - name: Build with Gradle
      run: ./gradlew bootJar -x test

    - name: Copy JAR to EC2 via SCP
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "build/libs/*.jar"
        target: "/home/ec2-user/app"

    - name: Restart Spring Boot App via SSH
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 60s
        script: |
          mkdir -p /home/ec2-user/app
          
          # Matar cualquier proceso previo en el puerto 8080 o java
          fuser -k 8080/tcp || true
          pkill -f 'java -jar' || true
          sleep 2
          
          # Usamos setsid para crear una nueva sesión de sistema completamente aislada del canal SSH
          setsid java -jar /home/ec2-user/app/build/libs/*.jar > /home/ec2-user/app/app.log 2>&1 &
          
          # Damos unos segundos para que arranque y salimos forzando salida limpia
          sleep 3