name: Deploy Spring Boot to EC2

on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "26" # Java 21 LTS es totalmente compatible con los runners; si tu código exige Java 26, prueba si el runner lo toma, o usa 21 que es la estándar estable recomendada para producción en AWS.

      # Usamos Gradle en lugar de Maven
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/app"

      - name: Restart Spring Boot App via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p /home/ec2-user/app
          pkill -f 'java -jar' || true
          
          # Lanzamos la app desacoplandola por completo del shell de SSH
          nohup java -jar /home/ec2-user/app/build/libs/*.jar > /home/ec2-user/app/app.log 2>&1 < /dev/null &
          
          # Damos un pequeño respiro para asegurarnos de que arrancó y liberamos el shell
          sleep 3
          echo "Spring Boot app restarted successfully."
