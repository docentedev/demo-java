name: Deploy Spring Boot to EC2

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21' # Si requieres otra versión puedes ajustarla aquí

    # Usamos Gradle en lugar de Maven
    - name: Build with Gradle
      run: ./gradlew bootJar -x test

    - name: Copy JAR to EC2 via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "build/libs/*.jar"
        target: "/home/ec2-user/app"

    - name: Restart Spring Boot App via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p /home/ec2-user/app
          
          # Matar cualquier proceso previo de Java de forma forzosa pero limpia
          fuser -k 8080/tcp || true
          pkill -f 'java -jar' || true
          
          # Esperar un segundo para asegurar que el puerto quede libre
          sleep 2
          
          # Lanzar la nueva versión desacoplada por completo
          nohup java -jar /home/ec2-user/app/build/libs/*.jar > /home/ec2-user/app/app.log 2>&1 < /dev/null &
          
          # Pausa breve para confirmar inicio y salir limpiamente
          sleep 3
          echo "Spring Boot app started successfully."